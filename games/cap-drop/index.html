<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cap Drop · Chezable</title>
<meta name="description" content="Slide the caps until the gold cap drops down the chute into the glass.">
<meta name="theme-color" content="#5271FF">
<meta property="og:title" content="Cap Drop · Chezable">
<meta property="og:description" content="Slide the caps until the gold cap drops down the chute into the glass.">
<meta property="og:image" content="/og/cap-drop.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/shell/ui.css">
<link rel="stylesheet" href="/g/cap-drop/style.css">
</head>
<body>
<main id="stage" aria-label="Cap Drop. Slide the caps so the gold cap reaches the bottom-right corner.">
  <div class="stage-hud">
    <div class="hud-score"><b id="lvl">Cap Drop</b><span id="par"></span></div>
    <div class="spacer"></div>
    <div class="moves"><b id="moves">0</b><span id="movesLbl">moves</span></div>
    <button class="icon-btn" id="hintBtn" aria-label="Hint">💡<span class="badge" id="hintN">3</span></button>
    <button class="icon-btn" id="restart" aria-label="Restart">↻</button>
  </div>
  <div class="stage-canvas" id="play"><canvas id="cv" tabindex="0" role="application" aria-label="Puzzle board"></canvas></div>
  <p id="tip" class="tip" aria-live="polite"></p>
</main>
<script src="/shell/chez.js"></script>
<script type="module" src="/g/cap-drop/game.js"></script>
</body>
</html>
