<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cut It in Half · Chezable</title>
<meta name="description" content="Stop the sliding saw at exactly 50 cm. Three cuts; the lowest total wins.">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:title" content="Cut It in Half · Chezable">
<meta property="og:description" content="Stop the sliding saw at exactly 50 cm. Three cuts; the lowest total wins.">
<meta property="og:image" content="/og/cut-in-half.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/shell/ui.css">
<link rel="stylesheet" href="/g/cut-in-half/style.css">
</head>
<body>
<main id="stage" aria-label="Cut It in Half. Tap or press Space to stop the saw at 50 centimetres.">
  <div class="stage-hud">
    <div class="hud-score"><b id="who">Cut It in Half</b><span id="round"></span></div>
    <div class="spacer"></div>
    <div id="total" class="total"></div>
  </div>
  <section id="board" class="board">
    <div id="guide"></div>
    <div id="plank" class="slab"><div class="wood"></div><span class="mark" id="plankMark">100CM</span></div>
    <div id="pieceL" class="slab"><div class="wood"></div></div>
    <div id="pieceR" class="slab"><div class="wood"></div></div>
    <span class="mark" id="labL"></span>
    <span class="mark" id="labR"></span>
    <div id="saw"></div>
  </section>
  <footer id="panel" class="panel"></footer>
</main>
<script src="/shell/chez.js"></script>
<script type="module" src="/g/cut-in-half/game.js"></script>
</body>
</html>
