<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zamia · Chezable</title>
<meta name="description" content="Dive the wreck with rival divers, grab treasure, and get back before the air or Papa the shark runs out your luck.">
<meta name="theme-color" content="#5271FF">
<meta property="og:title" content="Zamia · Chezable">
<meta property="og:description" content="Dive the wreck with rival divers, grab treasure, and get back before the air or Papa the shark runs out your luck.">
<meta property="og:image" content="/og/zamia.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/shell/ui.css">
<link rel="stylesheet" href="/g/zamia/style.css">
</head>
<body>
<main id="stage" aria-label="Zamia. A turn-based diving game against two rival divers.">
  <div class="stage-hud">
    <div class="hud-score"><b id="title">Zamia</b><span id="diveLbl"></span></div>
    <div class="air">
      <div class="airtop"><span id="airLbl">Air</span><b id="airNum">25</b></div>
      <div class="meter" role="meter" aria-label="Air" aria-valuemin="0" aria-valuemax="25" id="airMeter"><i id="airFill"></i></div>
      <span id="papaSpd"></span>
    </div>
  </div>
  <section id="sea-wrap" class="sea-wrap">
    <div id="event" class="event"></div>
    <div id="trench" class="trench" tabindex="0" aria-label="The trench, from the boat down to the deepest tile"><div id="sea" class="sea"><svg id="rope" aria-hidden="true"></svg></div></div>
  </section>
  <footer id="panel" class="zpanel">
    <p id="log" aria-live="polite"></p>
    <div id="diceRow"></div>
    <div id="actions" role="group" aria-label="Choices"></div>
    <div id="hold"><div id="chips"></div><span id="banked"></span></div>
  </footer>
</main>
<script src="/shell/chez.js"></script>
<script type="module" src="/g/zamia/game.js"></script>
</body>
</html>
