# One Worker serves the static build (apps/web/dist) and the API on the same origin.
# Static assets are served without invoking the Worker, except the paths in run_worker_first.
name = "chezable"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true
# Production: uncomment once chezable.com's DNS is on Cloudflare (spec §10.1).
# routes = [{ pattern = "chezable.com", custom_domain = true }, { pattern = "www.chezable.com", custom_domain = true }]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/c/*", "/b/*"]

[[d1_databases]]
binding = "DB"
database_name = "chezable"
# Replace with the id printed by `npx wrangler d1 create chezable` before the first remote deploy.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
PUBLIC_ORIGIN = ""     # empty: use the request's origin (works for previews and localhost)

[observability]
enabled = true

# Secrets (set with `npx wrangler secret put PEPPER`):
#   PEPPER   random string mixed into recovery-code hashes
