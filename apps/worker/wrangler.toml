# One Worker serves the static build (apps/web/dist) and the API on the same origin.
# Static assets are served without invoking the Worker, except the paths in run_worker_first.
name = "chezable"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true
# chezable.com and www are proxied DNS records on the chezable.com zone; these routes send them to this Worker.
routes = [
  { pattern = "chezable.com/*", zone_name = "chezable.com" },
  { pattern = "www.chezable.com/*", zone_name = "chezable.com" },
]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/c/*", "/b/*"]

[[d1_databases]]
binding = "DB"
database_name = "chezable"
database_id = "8de096af-0ab6-4c36-93db-8d0bcb36c2f3"
migrations_dir = "migrations"

[vars]
PUBLIC_ORIGIN = ""     # empty: use the request's origin (works for previews and localhost)

[observability]
enabled = true

# Secrets (set with `npx wrangler secret put PEPPER`):
#   PEPPER   random string mixed into recovery-code hashes
