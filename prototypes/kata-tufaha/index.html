<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kata Tufaha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --board:#dfe4e2; --hole:rgba(40,58,64,.2); --ink:#1b1d1e; --muted:#566166;
  --paper:#ffffff; --saw:#f26b1d; --tape:#ffd21f; --line:#1b1d1e; --veil:rgba(223,228,226,.6);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --board:#22323a; --hole:rgba(0,0,0,.38); --ink:#f2f0eb; --muted:#9db0b7; --paper:#18242a; --veil:rgba(20,30,35,.66); }
}
:root[data-theme="dark"]{ --board:#22323a; --hole:rgba(0,0,0,.38); --ink:#f2f0eb; --muted:#9db0b7; --paper:#18242a; --veil:rgba(20,30,35,.66); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(circle,var(--hole) 2.2px,transparent 2.7px) 0 0/24px 24px,var(--board);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto;touch-action:manipulation}
.bar{display:flex;align-items:center;gap:12px;padding:10px 14px 4px}
.sc{display:flex;flex-direction:column;line-height:1.05}
#score{font-family:"Archivo Black",Impact,sans-serif;font-size:26px}
#best{font-size:14px;font-weight:600;color:var(--muted)}
.spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--paper);color:var(--ink);font-size:18px;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--line);flex:none}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
#stage{position:relative;flex:1;min-height:360px;cursor:pointer}
canvas{display:block;width:100%;height:100%}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--veil);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:10;overflow-y:auto}
.overlay.show{display:flex}
.card{width:100%;max-width:380px;background:var(--paper);border:3px solid var(--line);border-radius:22px;box-shadow:0 7px 0 var(--line);padding:22px 20px;display:flex;flex-direction:column;gap:12px;margin:auto 0}
.card p{margin:0;font-size:17px;line-height:1.4}
.card h2{margin:0;font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:34px;line-height:1.05}
.muted{color:var(--muted);font-weight:600}
.title-plank{position:relative;height:80px;border:3px solid var(--line);border-radius:8px;overflow:hidden;transform:rotate(-2deg);margin-bottom:4px;
  background:
    repeating-linear-gradient(90deg, rgba(40,20,5,.55) 0 2px, transparent 2px 10%) top left/100% 11px no-repeat,
    repeating-linear-gradient(90deg, rgba(40,20,5,.28) 0 1px, transparent 1px 2%) top left/100% 6px no-repeat,
    radial-gradient(ellipse 22px 9px at 22% 66%, rgba(110,55,15,.5), transparent 72%),
    repeating-linear-gradient(177deg, transparent 0 6px, rgba(120,62,18,.16) 6px 7px, transparent 7px 13px),
    linear-gradient(180deg,#eab978,#cf904d)}
.outline{font-family:"Archivo Black",Impact,"Arial Black",sans-serif;color:#fff;-webkit-text-stroke:2.5px #1b1d1e;paint-order:stroke fill;white-space:nowrap}
.title-plank .outline{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-size:32px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn{font:700 18px/1 "Barlow",system-ui,sans-serif;padding:15px 20px;border-radius:14px;border:3px solid var(--line);cursor:pointer;box-shadow:0 5px 0 var(--line);color:#1b1d1e;background:var(--saw);width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn.alt{background:var(--paper);color:var(--ink)}
button:focus-visible{outline:3px solid var(--tape);outline-offset:3px}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:4px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);opacity:0;background:#1b1d1e;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="sc"><span id="score">0 apples</span><span id="best"></span></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="mute" aria-label="Mute sound">🔊</button>
  </header>
  <section id="stage"><canvas id="cv" aria-label="Game. Tap to throw a knife through the gap in the spinning ring."></canvas></section>
</div>

<div class="overlay show" id="menu">
  <div class="card">
    <div class="title-plank"><span class="outline">Kata Tufaha</span></div>
    <p>Tap to throw a knife. Time it so the knife flies through the gap in the spinning spiked ring and slices the apple.</p>
    <p class="muted">You have 10 knives. Hit the ring and the knife is lost. The ring spins faster with every knife you use.</p>
    <p class="muted" id="menuBest"></p>
    <button class="btn" id="startBtn">Start throwing</button>
  </div>
</div>
<div class="overlay" id="over"><div class="card" id="overCard"></div></div>
<div id="toast"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d'), stage=$('#stage');
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null}}
const KNIVES=10;
const TAU=Math.PI*2;
const angDiff=(a,b)=>{let d=((a-b)%TAU+TAU)%TAU; return d>Math.PI?TAU-d:d;};

/* ---------- layout ---------- */
let W=0,H=0,dpr=1,u=1,cx=0,cy=0,R=100,TH=20,AR=40,restY=0;
function layout(){
  const r=stage.getBoundingClientRect(); W=r.width; H=r.height; dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
  u=Math.min(W,H*0.62)/400;
  R=118*u; TH=24*u; AR=44*u; cx=W/2; cy=Math.max(R+60*u, H*0.3); restY=Math.min(H-80*u, cy+R+250*u);
}

/* ---------- state ---------- */
let mode='menu', knives=KNIVES, cuts=0, best=parseInt(store('tufaha.best'))||0;
let rot=0, dir=1, gapHalf=0.7, spawnT=0, ringAlive=true, appleColor='green', t=0;
let knife=null, debris=[], halves=[], sparks=[], flashT=0, shakeT=0;
function resetGame(){
  knives=KNIVES; cuts=0; debris=[]; halves=[]; sparks=[]; knife={state:'rest',y:0}; newRing(); mode='play'; paintHud();
}
function newRing(){
  ringAlive=true; spawnT=performance.now(); rot=Math.random()*TAU; dir=Math.random()<0.5?-1:1;
  gapHalf=Math.max(0.46,0.72-cuts*0.035);
  appleColor=Math.random()<0.5?'green':'red';
}
function omega(now){
  const used=KNIVES-knives;
  let w=1.5+used*0.38+cuts*0.06;
  if(cuts>=3) w*=1+0.35*Math.sin(now/1000*1.7);
  return w*dir;
}
function paintHud(){
  $('#score').textContent=cuts===1?'1 apple':`${cuts} apples`;
  $('#best').textContent=best?`Best ${best} of ${KNIVES}`:'No best yet';
}

/* ---------- throwing ---------- */
function throwKnife(){
  if(mode!=='play'||knife.state!=='rest'||!ringAlive) return;
  if(performance.now()-spawnT<320) return;
  ensureAudio(); knives--; knife={state:'fly',x:cx,y:restY,vy:-2100*u}; sfx.throw();
}
function hitRing(){
  knife.state='bounce'; knife.vx=(Math.random()<0.5?-1:1)*(220+Math.random()*160)*u; knife.vy=520*u; knife.spin=(Math.random()<0.5?-1:1)*14; knife.ang=0;
  sfx.clang(); shakeT=performance.now(); try{navigator.vibrate&&navigator.vibrate(40);}catch(e){}
  for(let i=0;i<12;i++){const a=-Math.PI/2+(Math.random()-0.5)*2.4,v=(160+Math.random()*260)*u;sparks.push({x:knife.x,y:knife.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.4+Math.random()*0.3});}
}
function sliceApple(){
  knife.state='stuck'; knife.t0=performance.now(); cuts++; ringAlive=false; flashT=performance.now();
  sfx.slice(); try{navigator.vibrate&&navigator.vibrate(25);}catch(e){}
  // ring shatters
  const n=14, span=(TAU-2*gapHalf)/n;
  for(let i=0;i<n;i++){
    const a0=rot+gapHalf+i*span, mid=a0+span/2, v=(220+Math.random()*240)*u;
    debris.push({a0:a0-rot,span,x:cx,y:cy,rot0:rot,vx:Math.cos(mid)*v,vy:Math.sin(mid)*v-120*u,spin:(Math.random()-0.5)*8,r:0,life:1.2});
  }
  halves.push({side:-1,x:cx,y:cy,vx:-170*u,vy:-260*u,rot:0,spin:-4,col:appleColor,life:1.4},{side:1,x:cx,y:cy,vx:170*u,vy:-260*u,rot:0,spin:4,col:appleColor,life:1.4});
  paintHud();
}
function afterKnife(){
  if(knives<=0){ setTimeout(gameOver,600); mode='ending'; return; }
  knife={state:'rest',y:0};
}

/* ---------- update ---------- */
function update(dt,now){
  if(ringAlive&&mode!=='menu') rot+=omega(now)*dt;
  if(cuts>=5&&ringAlive&&Math.random()<dt*0.35) dir*=-1;
  if(knife&&knife.state==='fly'){
    const steps=Math.ceil(Math.abs(knife.vy*dt)/(3*u));
    for(let s=0;s<steps&&knife.state==='fly';s++){
      knife.y+=knife.vy*dt/steps;
      const outer=cy+R+TH/2, inner=cy+R-TH/2;
      if(ringAlive&&knife.y<=outer&&knife.y>=inner-2*u){
        const margin=(5*u+TH/2)/R;
        if(angDiff(Math.PI/2,rot)>gapHalf-margin){ hitRing(); break; }
      }
      if(knife.y<=cy+AR*0.55){ knife.y=cy+AR*0.55; sliceApple(); }
    }
  } else if(knife&&knife.state==='bounce'){
    knife.vy+=1800*u*dt; knife.x+=knife.vx*dt; knife.y+=knife.vy*dt; knife.ang+=knife.spin*dt;
    if(knife.y>H+120*u){ afterKnife(); }
  } else if(knife&&knife.state==='stuck'){
    if(now-knife.t0>650){ knife={state:'rest',y:0}; if(knives<=0){ mode='ending'; setTimeout(gameOver,300);} else newRing(); }
  }
  for(const d of debris){ d.vy+=1500*u*dt; d.x+=d.vx*dt; d.y+=d.vy*dt; d.r+=d.spin*dt; d.life-=dt; }
  debris=debris.filter(d=>d.life>0&&d.y<H+200);
  for(const h of halves){ h.vy+=1500*u*dt; h.x+=h.vx*dt; h.y+=h.vy*dt; h.rot+=h.spin*dt; h.life-=dt; }
  halves=halves.filter(h=>h.life>0);
  for(const s of sparks){ s.vy+=900*u*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt; }
  sparks=sparks.filter(s=>s.life>0);
}

/* ---------- drawing ---------- */
function ringPath(r0,a0,a1){ctx.beginPath();ctx.arc(0,0,r0,a0,a1);}
function drawRingBody(a0,a1,showSpikes){
  const step=0.42;
  if(showSpikes){
    for(let a=a0+0.16;a<a1-0.08;a+=step){
      const b=R+TH/2-3*u, tip=R+TH/2+24*u, w=0.085;
      ctx.beginPath(); ctx.moveTo(Math.cos(a-w)*b,Math.sin(a-w)*b); ctx.lineTo(Math.cos(a)*tip,Math.sin(a)*tip); ctx.lineTo(Math.cos(a+w)*b,Math.sin(a+w)*b); ctx.closePath();
      ctx.fillStyle='#dfe4e8'; ctx.fill(); ctx.lineWidth=2.2*u; ctx.strokeStyle='#1b1d1e'; ctx.lineJoin='round'; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*b,Math.sin(a)*b); ctx.lineTo(Math.cos(a)*tip,Math.sin(a)*tip); ctx.strokeStyle='rgba(27,29,30,.25)'; ctx.lineWidth=1.2*u; ctx.stroke();
    }
  }
  ctx.lineCap='round';
  ringPath(R,a0,a1); ctx.strokeStyle='#1b1d1e'; ctx.lineWidth=TH+5*u; ctx.stroke();
  ringPath(R,a0,a1); ctx.strokeStyle='#a9b1b8'; ctx.lineWidth=TH; ctx.stroke();
  ringPath(R-TH*0.12,a0,a1); ctx.strokeStyle='#cfd5da'; ctx.lineWidth=TH*0.55; ctx.stroke();
  for(let a=a0+0.2;a<a1-0.05;a+=step){
    ctx.beginPath(); ctx.arc(Math.cos(a)*R,Math.sin(a)*R,4*u,0,TAU); ctx.fillStyle='#eef1f3'; ctx.fill(); ctx.lineWidth=1.8*u; ctx.strokeStyle='#1b1d1e'; ctx.stroke();
  }
}
function drawRing(now){
  const k=Math.min(1,(now-spawnT)/300), s=reduce?1:0.6+0.4*(1+2.2*Math.pow(k-1,3)+1.2*Math.pow(k-1,2));
  ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s); ctx.rotate(rot);
  drawRingBody(gapHalf,TAU-gapHalf,true);
  ctx.restore();
}
function appleShape(r){
  ctx.beginPath();
  ctx.moveTo(0,-r*0.62);
  ctx.bezierCurveTo(r*0.55,-r*1.05,r*1.12,-r*0.55,r*0.98,r*0.1);
  ctx.bezierCurveTo(r*0.86,r*0.8,r*0.38,r*1.05,0,r*0.88);
  ctx.bezierCurveTo(-r*0.38,r*1.05,-r*0.86,r*0.8,-r*0.98,r*0.1);
  ctx.bezierCurveTo(-r*1.12,-r*0.55,-r*0.55,-r*1.05,0,-r*0.62);
  ctx.closePath();
}
function drawApple(x,y,r,col,half){
  ctx.save(); ctx.translate(x,y);
  if(half){ ctx.beginPath(); ctx.rect(half<0?-r*1.4:0,-r*1.6,r*1.4,r*3); ctx.clip(); }
  const g=ctx.createRadialGradient(-r*0.35,-r*0.3,r*0.1,0,0,r*1.05);
  if(col==='green'){g.addColorStop(0,'#c9f27a');g.addColorStop(0.55,'#78c832');g.addColorStop(1,'#3f8f1c');}
  else{g.addColorStop(0,'#ff9a8a');g.addColorStop(0.55,'#e5322a');g.addColorStop(1,'#a3171a');}
  appleShape(r); ctx.fillStyle=g; ctx.fill(); ctx.lineWidth=3*u; ctx.strokeStyle='#1b1d1e'; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-r*0.42,-r*0.22,r*0.16,r*0.28,0.35,0,TAU); ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fill();
  if(half){
    ctx.beginPath(); ctx.ellipse(0,r*0.12,r*0.16,r*0.78,0,0,TAU); ctx.fillStyle='#fdf6d8'; ctx.fill(); ctx.lineWidth=2*u; ctx.strokeStyle='#1b1d1e'; ctx.stroke();
    ctx.fillStyle='#5a3a1e'; for(const sy of [-0.05,0.25]){ ctx.beginPath(); ctx.ellipse(0,r*sy,r*0.05,r*0.09,0,0,TAU); ctx.fill(); }
  }
  ctx.lineCap='round'; ctx.strokeStyle='#1b1d1e'; ctx.lineWidth=5*u; ctx.beginPath(); ctx.moveTo(0,-r*0.55); ctx.quadraticCurveTo(r*0.02,-r*0.9,-r*0.1,-r*1.05); ctx.stroke();
  ctx.strokeStyle='#7a4a22'; ctx.lineWidth=2.6*u; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r*0.02,-r*0.85); ctx.quadraticCurveTo(r*0.4,-r*1.2,r*0.75,-r*0.95); ctx.quadraticCurveTo(r*0.4,-r*0.62,r*0.02,-r*0.85);
  ctx.fillStyle='#4fae3a'; ctx.fill(); ctx.lineWidth=2.4*u; ctx.strokeStyle='#1b1d1e'; ctx.stroke();
  ctx.restore();
}
function drawKnife(x,y,ang,scale=1){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(u*scale,u*scale);
  ctx.lineJoin='round'; ctx.strokeStyle='#1b1d1e';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(9,18,10,42,4,58); ctx.lineTo(-4,58); ctx.bezierCurveTo(-10,42,-9,18,0,0); ctx.closePath();
  const g=ctx.createLinearGradient(-9,0,9,0); g.addColorStop(0,'#e9edf0'); g.addColorStop(0.5,'#b7c0c7'); g.addColorStop(1,'#8d979e');
  ctx.fillStyle=g; ctx.fill(); ctx.lineWidth=2.4; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,6); ctx.lineTo(0,54); ctx.strokeStyle='rgba(27,29,30,.3)'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.beginPath(); ctx.rect(-4.5,58,9,34); ctx.fillStyle='#b98a52'; ctx.fill(); ctx.strokeStyle='#1b1d1e'; ctx.lineWidth=2.2; ctx.stroke();
  ctx.strokeStyle='#7a5530'; ctx.lineWidth=1.6; for(let yy=62;yy<92;yy+=5){ctx.beginPath();ctx.moveTo(-4.5,yy);ctx.lineTo(4.5,yy+3);ctx.stroke();}
  ctx.beginPath(); ctx.arc(0,100,7.5,0,TAU); ctx.lineWidth=5.5; ctx.strokeStyle='#1b1d1e'; ctx.stroke(); ctx.lineWidth=3; ctx.strokeStyle='#c7cfd5'; ctx.stroke();
  ctx.restore();
}
function outlined(text,x,y,size,align='left'){
  ctx.font=`${size}px "Archivo Black", Impact, sans-serif`; ctx.textAlign=align; ctx.textBaseline='middle';
  ctx.lineJoin='round'; ctx.lineWidth=Math.max(4,size*0.2); ctx.strokeStyle='#1b1d1e'; ctx.strokeText(text,x,y); ctx.fillStyle='#fff'; ctx.fillText(text,x,y);
}
function draw(now){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(!reduce&&now-shakeT<200){ctx.translate((Math.random()-0.5)*8*u,(Math.random()-0.5)*8*u);}
  // apple (whole) when ring alive or waiting for new ring
  if(ringAlive) drawApple(cx,cy,AR,appleColor,0);
  if(ringAlive) drawRing(now);
  for(const d of debris){
    ctx.save(); ctx.globalAlpha=Math.min(1,d.life*1.5); ctx.translate(d.x,d.y); ctx.rotate(d.rot0+d.r);
    drawRingBody(d.a0,d.a0+d.span,true); ctx.restore();
  }
  for(const h of halves){ ctx.save(); ctx.globalAlpha=Math.min(1,h.life*1.5); ctx.translate(h.x,h.y); ctx.rotate(h.rot); drawApple(0,0,AR,h.col,h.side); ctx.restore(); }
  if(now-flashT<160){ ctx.fillStyle=`rgba(255,255,255,${0.5*(1-(now-flashT)/160)})`; ctx.beginPath(); ctx.arc(cx,cy,R*1.3,0,TAU); ctx.fill(); }
  for(const s of sparks){ ctx.fillStyle=`rgba(255,210,31,${Math.min(1,s.life*2.5)})`; ctx.beginPath(); ctx.arc(s.x,s.y,3*u,0,TAU); ctx.fill(); }
  // knife
  if(mode!=='menu'&&knife){
    if(knife.state==='rest'&&knives>0&&ringAlive){ const bob=Math.sin(now/300)*3*u; drawKnife(cx,restY+bob,0); }
    else if(knife.state==='fly') drawKnife(cx,knife.y,0);
    else if(knife.state==='stuck'){ const k=(now-knife.t0)/650; ctx.save(); ctx.globalAlpha=Math.max(0,1-k*1.4); drawKnife(cx,knife.y,0); ctx.restore(); }
    else if(knife.state==='bounce') drawKnife(knife.x,knife.y,knife.ang);
  }
  ctx.restore();
  // knife counter
  drawKnife(28*u+10,H-118*u,0,0.62);
  outlined('×'+knives,40*u+18,H-74*u,Math.round(30*u));
  if(mode==='play'&&cuts===0&&knives===KNIVES) outlined('Tap to throw',cx,restY-58*u,Math.round(22*u),'center');
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now;
  if(W>0&&H>0){ if(mode!=='menu') update(dt,now); else rot+=0.6*dt; draw(now); }
  requestAnimationFrame(loop);
}

/* ---------- end ---------- */
function gameOver(){
  mode='over';
  const newBest=cuts>best; if(newBest){best=cuts;store('tufaha.best',String(best));}
  paintHud();
  const verdict=cuts===KNIVES?'Every knife landed. Perfect run.':cuts>=7?'Sharp throwing.':cuts>=4?'Not bad. The fast knives are the hard ones.':'The ring won this time.';
  $('#overCard').innerHTML=`<h2>${cuts} of ${KNIVES} apples</h2><p class="muted">${verdict} ${newBest&&cuts>0?'New personal best.':`Your best is ${best} of ${KNIVES}.`}</p>
    <div class="stack"><button class="btn" id="againBtn">Throw again</button><button class="btn alt" id="shareBtn">Share result</button></div>`;
  $('#over').classList.add('show'); $('#againBtn').focus({preventScroll:true});
  $('#againBtn').onclick=()=>{$('#over').classList.remove('show');resetGame();};
  $('#shareBtn').onclick=share;
}
async function share(){
  const text=`I sliced ${cuts} of ${KNIVES} apples in Kata Tufaha. The ring spins faster with every knife. Beat that:`, url=location.href;
  try{ if(navigator.share){ await navigator.share({text,url}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text+' '+url); toast('Copied. Paste it in WhatsApp.'); }catch(e){ toast('Sharing is not available here'); }
}
let tt; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}

/* ---------- audio ---------- */
let ac=null,master=null,muted=store('tufaha.muted')==='1';
function ensureAudio(){ if(ac){if(ac.state==='suspended')ac.resume();return;} try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:0.9;master.connect(ac.destination);}catch(e){ac=null;} }
function tone(f0,f1,dur,type,vol,delay=0){ if(!ac)return; const t=ac.currentTime+delay,o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02); }
function noise(dur,freq,type,vol){ if(!ac)return; const len=Math.floor(ac.sampleRate*dur),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=ac.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start(); }
const sfx={
  throw(){noise(0.12,2500,'highpass',0.25);},
  clang(){tone(1400,900,0.25,'square',0.08);tone(2100,1500,0.3,'triangle',0.08);},
  slice(){noise(0.2,1800,'bandpass',0.5);tone(500,160,0.2,'sine',0.25);tone(300,80,0.35,'sawtooth',0.05,0.05);}
};
const muteBtn=$('#mute');
function paintMute(){muteBtn.textContent=muted?'🔇':'🔊';muteBtn.setAttribute('aria-label',muted?'Turn sound on':'Mute sound');}
paintMute();
muteBtn.onclick=()=>{ensureAudio();muted=!muted;store('tufaha.muted',muted?'1':'0');if(master)master.gain.value=muted?0:0.9;paintMute();};

/* ---------- input ---------- */
$('#app').addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; throwKnife(); });
document.addEventListener('keydown',e=>{ if((e.code==='Space'||e.code==='ArrowUp')&&mode==='play'){ e.preventDefault(); throwKnife(); } });
window.addEventListener('resize',layout);
$('#startBtn').onclick=()=>{ ensureAudio(); $('#menu').classList.remove('show'); resetGame(); };
$('#menuBest').textContent=best?`Your best: ${best} of ${KNIVES} apples.`:'';
layout(); newRing(); paintHud();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);
requestAnimationFrame(t=>{last=t;loop(t);});
})();
</script>
