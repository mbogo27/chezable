<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kifuniko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --board:#dfe4e2; --hole:rgba(40,58,64,.2); --ink:#1b1d1e; --muted:#566166;
  --paper:#ffffff; --saw:#f26b1d; --tape:#ffd21f; --line:#1b1d1e; --veil:rgba(223,228,226,.6);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --board:#22323a; --hole:rgba(0,0,0,.38); --ink:#f2f0eb; --muted:#9db0b7; --paper:#18242a; --veil:rgba(20,30,35,.66); }
}
:root[data-theme="dark"]{ --board:#22323a; --hole:rgba(0,0,0,.38); --ink:#f2f0eb; --muted:#9db0b7; --paper:#18242a; --veil:rgba(20,30,35,.66); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(circle,var(--hole) 2.2px,transparent 2.7px) 0 0/24px 24px,var(--board);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.lv{display:flex;flex-direction:column;line-height:1.05}
#lvl{font-family:"Archivo Black",Impact,sans-serif;font-size:24px}
#par{font-size:14px;font-weight:600;color:var(--muted)}
.spacer{flex:1}
.moves{text-align:center;line-height:1}
.moves b{display:block;font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:26px}
.moves span{font-size:13px;font-weight:700;color:var(--muted)}
.icon-btn{position:relative;width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--paper);color:var(--ink);font-size:18px;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--line);flex:none;font-weight:700}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.badge{position:absolute;right:-7px;bottom:-7px;min-width:20px;height:20px;border-radius:10px;background:#1b1d1e;color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px}
#stage{position:relative;flex:1;min-height:320px;touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:pointer}
#tip{text-align:center;font-size:15px;font-weight:600;color:var(--muted);padding:0 16px 14px;min-height:20px}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--veil);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:10;overflow-y:auto}
.overlay.show{display:flex}
.card{width:100%;max-width:380px;background:var(--paper);border:3px solid var(--line);border-radius:22px;box-shadow:0 7px 0 var(--line);padding:22px 20px;display:flex;flex-direction:column;gap:12px;margin:auto 0}
.card p{margin:0;font-size:17px;line-height:1.4}
.card h2{margin:0;font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:32px;line-height:1.05}
.stars{font-size:34px;letter-spacing:4px}
.stars .off{opacity:.2;filter:grayscale(1)}
.muted{color:var(--muted);font-weight:600}
.title-plank{position:relative;height:80px;border:3px solid var(--line);border-radius:8px;overflow:hidden;transform:rotate(-2deg);margin-bottom:4px;
  background:
    repeating-linear-gradient(90deg, rgba(40,20,5,.55) 0 2px, transparent 2px 10%) top left/100% 11px no-repeat,
    repeating-linear-gradient(90deg, rgba(40,20,5,.28) 0 1px, transparent 1px 2%) top left/100% 6px no-repeat,
    radial-gradient(ellipse 22px 9px at 22% 66%, rgba(110,55,15,.5), transparent 72%),
    repeating-linear-gradient(177deg, transparent 0 6px, rgba(120,62,18,.16) 6px 7px, transparent 7px 13px),
    linear-gradient(180deg,#eab978,#cf904d)}
.outline{font-family:"Archivo Black",Impact,"Arial Black",sans-serif;color:#fff;-webkit-text-stroke:2.5px #1b1d1e;paint-order:stroke fill;white-space:nowrap}
.title-plank .outline{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-size:34px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn{font:700 18px/1 "Barlow",system-ui,sans-serif;padding:15px 20px;border-radius:14px;border:3px solid var(--line);cursor:pointer;box-shadow:0 5px 0 var(--line);color:#1b1d1e;background:var(--saw);width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn.alt{background:var(--paper);color:var(--ink)}
button:focus-visible{outline:3px solid var(--tape);outline-offset:3px}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:4px}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="lv"><span id="lvl">Level 1</span><span id="par"></span></div>
    <div class="spacer"></div>
    <div class="moves"><b id="moves">0</b><span>moves</span></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="hintBtn" aria-label="Show the best next move">💡<span class="badge" id="hintN">3</span></button>
    <button class="icon-btn" id="restart" aria-label="Restart level">↻</button>
    <button class="icon-btn" id="mute" aria-label="Mute sound">🔊</button>
  </header>
  <section id="stage"><canvas id="cv" aria-label="Puzzle board. Tap a cap next to an empty space to slide it."></canvas></section>
  <div id="tip"></div>
</div>

<div class="overlay show" id="menu">
  <div class="card">
    <div class="title-plank"><span class="outline">Kifuniko</span></div>
    <p>Slide the gold cap down the chute into the glass. Tap any cap next to an empty space to slide it in, or swipe it the way you want it to go.</p>
    <p class="muted">Each level shows the fewest moves possible. Match it for three stars. Every level is generated fresh, and every one can be solved.</p>
    <button class="btn" id="playBtn">Play</button>
  </div>
</div>
<div class="overlay" id="msg"><div class="card" id="msgCard"></div></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d'), stage=$('#stage');
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null}}
function xmur3(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0;};}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- puzzle logic ----------
   State = position of the gold cap + set of empty cells (plain caps are identical).
   A move slides any cap into an orthogonally adjacent empty cell.
   Win when the gold cap reaches the exit cell (bottom-right).        */
function neighbors(i,n){const x=i%n,y=(i/n)|0,r=[];if(x>0)r.push(i-1);if(x<n-1)r.push(i+1);if(y>0)r.push(i-n);if(y<n-1)r.push(i+n);return r;}
const key=(s,E)=>s+'|'+E.slice().sort((a,b)=>a-b).join(',');
function solve(n,s,E){
  const exit=n*n-1; if(s===exit) return {dist:0,first:null};
  const start=key(s,E), seen=new Map([[start,null]]), q=[[s,E.slice()]];
  let head=0;
  while(head<q.length){
    const [cs,ce]=q[head++], ck=key(cs,ce);
    for(let ei=0;ei<ce.length;ei++){
      const e=ce[ei];
      for(const c of neighbors(e,n)){
        if(ce.includes(c)) continue;
        const ns=c===cs?e:cs, ne=ce.slice(); ne[ei]=c;
        const nk=key(ns,ne); if(seen.has(nk)) continue;
        seen.set(nk,{prev:ck,move:{from:c,to:e}});
        if(ns===exit){
          let k=nk, path=[]; while(seen.get(k)){path.unshift(seen.get(k).move);k=seen.get(k).prev;}
          return {dist:path.length,first:path[0]};
        }
        q.push([ns,ne]);
      }
    }
  }
  return {dist:Infinity,first:null};
}
function cfgFor(L){
  if(L<=3) return {n:3,k:2,lo:L+1};
  if(L<=7) return {n:3,k:1,lo:4+(L-4)*2};
  if(L<=12) return {n:4,k:2,lo:5+(L-8)};
  if(L<=18) return {n:4,k:1,lo:8+(L-13)*2};
  return {n:5,k:1,lo:Math.min(28,14+(L-19))};
}
function generate(L){
  const r=mulberry(xmur3('kifuniko-'+L)()), c=cfgFor(L), n=c.n, N=n*n, exit=N-1, lo=c.lo, hi=c.lo+3;
  let best=null, bestD=-1;
  for(let t=0;t<220;t++){
    let s; do{s=Math.floor(r()*N);}while(s===exit);
    const pool=[]; for(let i=0;i<N;i++) if(i!==s) pool.push(i);
    const E=[]; for(let k=0;k<c.k;k++){const j=Math.floor(r()*pool.length);E.push(pool.splice(j,1)[0]);}
    const d=solve(n,s,E).dist;
    if(d>=lo&&d<=hi) return {n,s,E,par:d};
    if(d<Infinity&&(bestD<lo?d>bestD:(d<=hi&&d>bestD))){best={n,s,E,par:d};bestD=d;}
  }
  return best;
}

/* ---------- state ---------- */
let level=parseInt(store('kifuniko.level'))||1, P=null, pieces=[], cells=[], moves=0, hints=3, playing=false, hintMove=null, hintUntil=0;
let drop=null, fill=0, bubbles=[];
function loadLevel(L){
  level=L; store('kifuniko.level',String(L));
  P=generate(L); const N=P.n*P.n; moves=0; hints=3; hintMove=null; drop=null; fill=0; bubbles=[];
  cells=new Array(N).fill(-1); pieces=[];
  for(let i=0;i<N;i++){ if(P.E.includes(i)) continue; const id=pieces.length; pieces.push({id,cell:i,gold:i===P.s,ax:i%P.n,ay:(i/P.n)|0}); cells[i]=id; }
  playing=true; layout(); paintHud();
  $('#tip').textContent=L===1?'Tap a cap next to an empty space to slide it.':'';
}
function paintHud(){
  $('#lvl').textContent='Level '+level;
  $('#par').textContent=`Best possible: ${P.par} ${P.par===1?'move':'moves'}`;
  $('#moves').textContent=moves; $('#hintN').textContent=hints;
}

/* ---------- layout ---------- */
let W=0,H=0,dpr=1,cell=80,bx=0,by=0,T=12,pad=10,glass={};
function layout(){
  const r=stage.getBoundingClientRect(); W=r.width; H=r.height; dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!P) return;
  const n=P.n;
  const size=Math.min(W*0.84,400,(H-40)/(1+1.75/n));
  cell=size/n; T=Math.max(8,cell*0.15); pad=T*0.75;
  bx=(W-size)/2; by=Math.max(16,(H-size-cell*1.75-10)/2);
  const ex=bx+(n-0.5)*cell, chuteBot=by+size+pad+cell*0.35;
  const gh=Math.min(cell*1.25,H-chuteBot-12), gw=Math.min(cell*0.95,gh*0.85);
  glass={x:ex,top:chuteBot+4,h:gh,w:gw};
}
const px=i=>bx+((i%P.n)+0.5)*cell, py=i=>by+(((i/P.n)|0)+0.5)*cell;

/* ---------- moves ---------- */
function tryMove(id,dir){
  if(!playing||drop) return;
  const p=pieces[id], n=P.n, opts=neighbors(p.cell,n).filter(c=>cells[c]===-1);
  if(!opts.length){ sfx.bonk(); p.shake=performance.now(); return; }
  let to=null;
  if(dir){ const x=p.cell%n,y=(p.cell/n)|0, t=dir==='l'?(x>0?p.cell-1:-1):dir==='r'?(x<n-1?p.cell+1:-1):dir==='u'?(y>0?p.cell-n:-1):(y<n-1?p.cell+n:-1);
    if(t>=0&&cells[t]===-1) to=t; }
  if(to===null){
    if(dir&&opts.length>1){ sfx.bonk(); p.shake=performance.now(); return; }
    const exit=n*n-1;
    to=p.gold&&opts.includes(exit)?exit:opts[0];
    if(opts.length>1&&!dir){ const best=solve(n,goldCell(),emptyCells()).first; if(best&&best.from===p.cell&&opts.includes(best.to)) to=best.to; }
  }
  cells[p.cell]=-1; cells[to]=id; p.cell=to; moves++; hintMove=null; sfx.slide(); paintHud(); $('#tip').textContent='';
  if(p.gold&&to===n*n-1){ playing=false; setTimeout(()=>{drop={t0:performance.now(),id};sfx.drop();},170); }
}
const goldCell=()=>pieces.find(p=>p.gold).cell;
const emptyCells=()=>cells.map((v,i)=>v===-1?i:-1).filter(i=>i>=0);
function starsFor(m){return m<=P.par?3:m<=P.par+Math.max(3,Math.ceil(P.par*0.5))?2:1;}
function win(){
  const st=starsFor(moves), n=level;
  const bestK='kifuniko.stars.'+n, prev=parseInt(store(bestK))||0; if(st>prev) store(bestK,String(st));
  sfx.win();
  $('#msgCard').innerHTML=`<h2>Level ${n} solved</h2>
    <div class="stars">${[1,2,3].map(i=>`<span class="${i<=st?'':'off'}">⭐</span>`).join('')}</div>
    <p class="muted">${moves} ${moves===1?'move':'moves'}. The best possible is ${P.par}.${st<3?' Replay it to chase three stars.':''}</p>
    <div class="stack"><button class="btn" id="nextBtn">Play level ${n+1}</button>${st<3?'<button class="btn alt" id="replayBtn">Try this level again</button>':''}</div>`;
  $('#msg').classList.add('show'); $('#nextBtn').focus({preventScroll:true});
  $('#nextBtn').onclick=()=>{$('#msg').classList.remove('show');loadLevel(n+1);};
  const rb=$('#replayBtn'); if(rb) rb.onclick=()=>{$('#msg').classList.remove('show');loadLevel(n);};
}

/* ---------- drawing ---------- */
function framePath(){
  const n=P.n, size=n*cell, L=bx-pad, R=bx+size+pad, Tp=by-pad, B=by+size+pad;
  const gl=bx+(n-1)*cell-pad*0.2, chute=cell*0.35;
  ctx.beginPath();
  ctx.moveTo(gl,B+chute); ctx.lineTo(gl,B); ctx.lineTo(L,B); ctx.lineTo(L,Tp); ctx.lineTo(R,Tp); ctx.lineTo(R,B+chute);
}
function drawFrame(){
  ctx.lineCap='round'; ctx.lineJoin='round';
  framePath(); ctx.strokeStyle='#1b1d1e'; ctx.lineWidth=T+6; ctx.stroke();
  framePath(); ctx.strokeStyle='#2bb3a3'; ctx.lineWidth=T; ctx.stroke();
  framePath(); ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=T*0.25; ctx.stroke();
  // cell wells
  const n=P.n;
  for(let i=0;i<n*n;i++){ ctx.beginPath(); ctx.arc(px(i),py(i),cell*0.4,0,7); ctx.fillStyle= i===n*n-1?'rgba(255,204,51,.22)':'rgba(27,29,30,.07)'; ctx.fill(); }
  const e=n*n-1; ctx.save(); ctx.strokeStyle='rgba(27,29,30,.35)'; ctx.lineWidth=2; ctx.setLineDash([5,6]); ctx.beginPath(); ctx.arc(px(e),py(e),cell*0.4,0,7); ctx.stroke(); ctx.restore();
  ctx.fillStyle='rgba(27,29,30,.35)'; ctx.beginPath(); const ax=px(e), ay=py(e)+cell*0.12, s=cell*0.11;
  ctx.moveTo(ax-s,ay-s*0.6); ctx.lineTo(ax+s,ay-s*0.6); ctx.lineTo(ax,ay+s*0.7); ctx.closePath(); ctx.fill();
}
function drawCap(x,y,r,gold,glow){
  ctx.save(); ctx.translate(x,y);
  if(glow){ ctx.beginPath(); ctx.arc(0,0,r*1.18,0,7); ctx.fillStyle=`rgba(63,191,106,${glow})`; ctx.fill(); }
  ctx.beginPath(); const teeth=21;
  for(let i=0;i<teeth*2;i++){const a=i/(teeth*2)*Math.PI*2, rr=i%2?r*0.93:r; ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);} ctx.closePath();
  ctx.fillStyle=gold?'#d99a12':'#1f4fa8'; ctx.fill(); ctx.strokeStyle='#1b1d1e'; ctx.lineWidth=Math.max(1.5,r*0.05); ctx.stroke();
  const g=ctx.createRadialGradient(-r*0.3,-r*0.35,r*0.1,0,0,r*0.82);
  if(gold){g.addColorStop(0,'#fff1a8');g.addColorStop(0.5,'#ffcc33');g.addColorStop(1,'#e8a412');}
  else{g.addColorStop(0,'#8fb8ff');g.addColorStop(0.5,'#3a78e0');g.addColorStop(1,'#2558b8');}
  ctx.beginPath(); ctx.arc(0,0,r*0.8,0,7); ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,r*0.6,0,7); ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=r*0.06; ctx.stroke();
  if(gold){
    ctx.beginPath(); for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*0.18:r*0.42; ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);} ctx.closePath();
    ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#b97c0a'; ctx.lineWidth=r*0.05; ctx.stroke();
  } else {
    ctx.beginPath(); ctx.ellipse(-r*0.25,-r*0.3,r*0.22,r*0.1,-0.6,0,7); ctx.fillStyle='rgba(255,255,255,.45)'; ctx.fill();
  }
  ctx.restore();
}
function drawGlass(now){
  const {x,top,h,w}=glass, bw=w*0.78, bot=top+h;
  const xl=y=>x-(w/2+(bw/2-w/2)*((y-top)/h)), xr=y=>x+(w/2+(bw/2-w/2)*((y-top)/h));
  ctx.beginPath(); ctx.moveTo(xl(top),top); ctx.lineTo(xr(top),top); ctx.lineTo(xr(bot),bot); ctx.lineTo(xl(bot),bot); ctx.closePath();
  ctx.fillStyle='rgba(255,255,255,.32)'; ctx.fill();
  const inBot=bot-h*0.08;
  if(fill>0.002){
    const ly=inBot-fill*(inBot-top-h*0.08), wob=Math.sin(now/170)*1.5;
    ctx.beginPath(); ctx.moveTo(xl(ly)+4,ly+wob); ctx.lineTo(xr(ly)-4,ly-wob); ctx.lineTo(xr(inBot)-4,inBot); ctx.lineTo(xl(inBot)+4,inBot); ctx.closePath();
    const gr=ctx.createLinearGradient(0,ly,0,inBot); gr.addColorStop(0,'#ffb347'); gr.addColorStop(1,'#e8731a'); ctx.fillStyle=gr; ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.75)';
    for(const b of bubbles){ if(b.y>ly) { ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); } }
    ctx.beginPath(); ctx.ellipse(x,ly,(xr(ly)-xl(ly))/2-4,3,0,0,7); ctx.fillStyle='rgba(255,250,235,.85)'; ctx.fill();
  }
  ctx.fillStyle='rgba(255,255,255,.4)'; ctx.fillRect(xl(bot)+3,inBot,(xr(bot)-xl(bot))-6,bot-inBot);
  ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(xl(top)+8,top+10); ctx.lineTo(xl(bot)+8,bot-14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(xl(top),top); ctx.lineTo(xl(bot),bot); ctx.lineTo(xr(bot),bot); ctx.lineTo(xr(top),top);
  ctx.strokeStyle='#1b1d1e'; ctx.lineWidth=3.5; ctx.lineJoin='round'; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x,top,w/2,3.5,0,0,7); ctx.lineWidth=2.5; ctx.stroke();
}
function draw(now,dt){
  ctx.clearRect(0,0,W,H); if(!P) return;
  drawGlass(now); drawFrame();
  const n=P.n, r=cell*0.4;
  if(hintMove&&now>hintUntil) hintMove=null;
  for(const p of pieces){
    const tx=p.cell%n, ty=(p.cell/n)|0, k=Math.min(1,dt*(reduce?60:18));
    p.ax+=(tx-p.ax)*k; p.ay+=(ty-p.ay)*k;
    let x=bx+(p.ax+0.5)*cell, y=by+(p.ay+0.5)*cell;
    if(p.shake&&now-p.shake<260) x+=Math.sin((now-p.shake)/20)*4;
    if(drop&&drop.id===p.id){
      const t=(now-drop.t0)/1000, tgt=glass.top+glass.h*0.5, y0=py(n*n-1), g=t*t*1400;
      y=Math.min(y0+g,tgt); const sc=y>=tgt?Math.max(0,1-(t-Math.sqrt((tgt-y0)/1400))*4):1;
      if(sc<=0){ if(!drop.done){drop.done=true;drop.fillT=now;} continue; }
      drawCap(x,y,r*Math.max(0.35,Math.min(1,glass.w/(2*r)*0.9))*sc,true,0); continue;
    }
    const glow=hintMove&&hintMove.from===p.cell?0.35+0.25*Math.sin(now/140):0;
    drawCap(x,y,r,p.gold,glow);
  }
  if(hintMove){
    const a={x:px(hintMove.from),y:py(hintMove.from)}, b={x:px(hintMove.to),y:py(hintMove.to)};
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=Math.sign(b.x-a.x), dy=Math.sign(b.y-a.y), s=cell*0.13;
    ctx.beginPath(); ctx.moveTo(mx+dx*s*1.3,my+dy*s*1.3); ctx.lineTo(mx-dx*s+dy*s,my-dy*s-dx*s); ctx.lineTo(mx-dx*s-dy*s,my-dy*s+dx*s); ctx.closePath();
    ctx.fillStyle='#3fbf6a'; ctx.fill(); ctx.strokeStyle='#1b1d1e'; ctx.lineWidth=2; ctx.stroke();
  }
  if(drop&&drop.done){
    const k=Math.min(1,(now-drop.fillT)/1100); fill=0.85*(1-Math.pow(1-k,3));
    if(bubbles.length<26&&Math.random()<0.6) bubbles.push({x:glass.x+(Math.random()-0.5)*glass.w*0.6,y:glass.top+glass.h*0.9,r:1+Math.random()*2.2,v:20+Math.random()*40});
    if(k>=1&&!drop.won){drop.won=true;setTimeout(win,450);}
  }
  for(const b of bubbles){ b.y-=b.v*dt; if(b.y<glass.top+glass.h*(0.92-fill)) { b.y=glass.top+glass.h*0.9; } }
}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;draw(now,dt);requestAnimationFrame(loop);}

/* ---------- input ---------- */
let down=null;
function cellAt(e){const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;const cx=Math.floor((x-bx)/cell),cy=Math.floor((y-by)/cell);if(!P||cx<0||cy<0||cx>=P.n||cy>=P.n)return -1;return cy*P.n+cx;}
cv.addEventListener('pointerdown',e=>{ ensureAudio(); const c=cellAt(e); down={c,x:e.clientX,y:e.clientY}; try{cv.setPointerCapture(e.pointerId);}catch(_){} });
cv.addEventListener('pointerup',e=>{
  if(!down) return; const d=down; down=null; if(d.c<0||cells[d.c]===-1) return;
  const dx=e.clientX-d.x, dy=e.clientY-d.y; let dir=null;
  if(Math.hypot(dx,dy)>22) dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u');
  tryMove(cells[d.c],dir);
});
cv.addEventListener('pointercancel',()=>{down=null;});
window.addEventListener('resize',layout);
$('#restart').onclick=()=>{ensureAudio();if(P)loadLevel(level);};
$('#hintBtn').onclick=()=>{
  if(!playing||drop) return; ensureAudio();
  if(hints<=0){ $('#tip').textContent='No hints left on this level. Restarting gives you three more.'; return; }
  const s=solve(P.n,goldCell(),emptyCells()); if(!s.first) return;
  hintMove=s.first; hintUntil=performance.now()+3500; hints--; paintHud(); sfx.ding();
  $('#tip').textContent=`You're ${s.dist} ${s.dist===1?'move':'moves'} away from the glass.`;
};

/* ---------- audio ---------- */
let ac=null,master=null,muted=store('kifuniko.muted')==='1';
function ensureAudio(){ if(ac){if(ac.state==='suspended')ac.resume();return;} try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:0.9;master.connect(ac.destination);}catch(e){ac=null;} }
function tone(f0,f1,dur,type,vol,delay=0){ if(!ac)return; const t=ac.currentTime+delay,o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02); }
const sfx={
  slide(){tone(520,380,0.08,'triangle',0.12);},
  bonk(){tone(150,90,0.12,'square',0.08);},
  ding(){tone(880,1320,0.14,'sine',0.13);},
  drop(){tone(900,200,0.35,'sine',0.14);tone(400,800,0.2,'triangle',0.08,0.3);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.22,'triangle',0.15,i*0.09));}
};
const muteBtn=$('#mute');
function paintMute(){muteBtn.textContent=muted?'🔇':'🔊';muteBtn.setAttribute('aria-label',muted?'Turn sound on':'Mute sound');}
paintMute();
muteBtn.onclick=()=>{ensureAudio();muted=!muted;store('kifuniko.muted',muted?'1':'0');if(master)master.gain.value=muted?0:0.9;paintMute();};

$('#playBtn').textContent=level>1?`Continue from level ${level}`:'Play';
$('#playBtn').onclick=()=>{ensureAudio();$('#menu').classList.remove('show');loadLevel(level);};
P=generate(level); const N0=P.n*P.n; cells=new Array(N0).fill(-1);
for(let i=0;i<N0;i++){ if(P.E.includes(i)) continue; const id=pieces.length; pieces.push({id,cell:i,gold:i===P.s,ax:i%P.n,ay:(i/P.n)|0}); cells[i]=id; }
layout(); paintHud();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);
requestAnimationFrame(t=>{last=t;loop(t);});
})();
</script>
</body>
</html>
